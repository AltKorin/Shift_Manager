{% extends 'shift_manager/base.html' %}

{% block title %}Nowa zmiana{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card mt-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="bi bi-calendar-plus"></i> Dodaj nową zmianę</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save"></i> Zapisz zmianę
                    </button>
                    <a href="{% url 'schedule' %}" class="btn btn-secondary ms-2">
                        Anuluj
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
